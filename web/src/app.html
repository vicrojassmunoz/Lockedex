    <script data-cfasync="false">
      // Lockedex: las partidas viven en un archivo en tu
      // ordenador (Documentos\Lockedex\partidas.json), no en el navegador.
      ;(function () {
        var URL_ESTADO = '/__escritorio/estado'
        var ls = window.localStorage
        var proto = Storage.prototype
        var setItem = proto.setItem
        var removeItem = proto.removeItem
        var clear = proto.clear

        function instantanea() {
          var o = {}
          for (var i = 0; i < ls.length; i++) {
            var k = ls.key(i)
            o[k] = ls.getItem(k)
          }
          return o
        }

        // Cada cambio deja una marca de revisión. Si el navegador tiene datos
        // más nuevos que el archivo (p. ej. al cambiar de página justo después
        // de guardar), se conservan y se escriben en el archivo.
        var CLAVE_REV = '__escritorio.rev'
        function marcar() {
          setItem.call(ls, CLAVE_REV, String(Date.now()))
        }

        var ultimo = null
        var pendiente = false
        try {
          var xhr = new XMLHttpRequest()
          xhr.open('GET', URL_ESTADO, false)
          xhr.send(null)
          var revLocal = +ls.getItem(CLAVE_REV) || 0
          if (xhr.status === 200) {
            var datos = JSON.parse(xhr.responseText)
            if (datos && datos.claves && typeof datos.claves === 'object') {
              var revArchivo = +datos.claves[CLAVE_REV] || 0
              if (revLocal > 0 && revLocal >= revArchivo) {
                pendiente = true
              } else {
                clear.call(ls)
                Object.keys(datos.claves).forEach(function (k) {
                  setItem.call(ls, k, String(datos.claves[k]))
                })
                ultimo = JSON.stringify(instantanea())
              }
            } else pendiente = true
          } else pendiente = true
        } catch (e) {
          console.error('[escritorio] No se pudieron cargar las partidas', e)
        }

        var temporizador = null
        function guardar() {
          clearTimeout(temporizador)
          temporizador = null
          var claves = JSON.stringify(instantanea())
          if (claves === ultimo) return Promise.resolve(true)
          var cuerpo =
            '{"version":1,"guardado":"' + new Date().toISOString() +
            '","claves":' + claves + '}'
          return fetch(URL_ESTADO, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: cuerpo
          })
            .then(function (r) {
              if (r.ok) {
                ultimo = claves
                window.dispatchEvent(new Event('lx:guardado'))
              }
              return r.ok
            })
            .catch(function (e) {
              console.error('[escritorio] No se pudo guardar', e)
              return false
            })
        }
        var avisoCambio = null
        function programar() {
          clearTimeout(temporizador)
          temporizador = setTimeout(guardar, 250)
          clearTimeout(avisoCambio)
          avisoCambio = setTimeout(function () {
            window.dispatchEvent(new Event('lx:cambio'))
          }, 60)
        }

        proto.setItem = function (k, v) {
          var cambia = this === ls && k !== CLAVE_REV && ls.getItem(k) !== String(v)
          setItem.call(this, k, v)
          if (cambia) {
            marcar()
            programar()
          }
        }
        proto.removeItem = function (k) {
          var cambia = this === ls && k !== CLAVE_REV && ls.getItem(k) !== null
          removeItem.call(this, k)
          if (cambia) {
            marcar()
            programar()
          }
        }
        proto.clear = function () {
          clear.call(this)
          if (this === ls) {
            marcar()
            programar()
          }
        }

        window.__escritorioGuardar = guardar
        setInterval(guardar, 15000)
        if (pendiente) {
          if (!ls.getItem(CLAVE_REV)) marcar()
          programar()
        }
      })()
    </script>

    <script data-cfasync="false">
      // On page load or when changing themes, best to add inline in `head` to avoid FOUC
      const lsid = 'nuzlocke.theme'
      const mdark =
        !(lsid in localStorage) &&
        window.matchMedia('(prefers-color-scheme: dark)').matches

      if (mdark) localStorage.setItem(lsid, 'dark')
      if (localStorage[lsid] === 'dark') {
        document.documentElement.classList.add('dark')
      } else {
        document.documentElement.classList.remove('dark')
      }
    </script>
